name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --cwd src --frozen-lockfile
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Build standalone executable
        run: bun run --cwd src build "$RELEASE_TAG" dist "$RELEASE_ARCH"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
      - name: Check executable
        run: '"src/dist/uncode-linux-$RELEASE_ARCH" --version'
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: uncode-${{ matrix.arch }}
          path: |
            src/dist/uncode-linux-${{ matrix.arch }}*
            src/dist/install.sh
            src/dist/uninstall.sh
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: uncode-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Uncode $RELEASE_TAG" "${flags[@]}"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
